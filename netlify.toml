[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api/* calls to the Render backend (avoids CORS issues)
[[redirects]]
  from = "/api/*"
  to = "https://blue-craft-properties.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback — send all non-file routes to index.html so React Router works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
